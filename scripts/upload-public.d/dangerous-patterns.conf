# -*- coding: utf-8 -*-
# Patterns to SCAN for in file contents (regex)
# One pattern per line, comments start with #

# Private keys
BEGIN RSA PRIVATE KEY
BEGIN PRIVATE KEY
BEGIN PGP PRIVATE KEY
BEGIN OPENSSH PRIVATE KEY
BEGIN EC PRIVATE KEY

# API patterns
api[_-]?key
api[_-]?secret
access[_-]?token
auth[_-]?token
bearer [a-zA-Z0-9]

# Common secret variable names
PASSWORD=
PASSWD=
SECRET=
PRIVATE_KEY=

# AWS
AKIA[0-9A-Z]{16}
aws_access_key_id
aws_secret_access_key

# GitHub tokens
ghp_[a-zA-Z0-9]{36}
gho_[a-zA-Z0-9]{36}
github_token

# OpenAI
sk-[a-zA-Z0-9]{48}

# Anthropic
sk-ant-[a-zA-Z0-9-]{90,}

# Generic long tokens (be careful with false positives)
# [a-zA-Z0-9]{32,}

# PyPI API tokens
pypi-[A-Za-z0-9_-]{50,}
